# Check every push and pull request: one version across all files, the Python tests, and
# the VS Code extension's unit tests when letify-ext/ exists.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Check every file carries the pyproject.toml version
        run: uv run --no-project python scripts/version.py check
      - name: Lint
        run: uv run ruff check letify tests
      - name: Test
        run: uv run pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for the extension
        id: ext
        run: |
          if [ -f letify-ext/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ext.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: letify-ext/package-lock.json
      - name: Install, build and test
        if: steps.ext.outputs.present == 'true'
        working-directory: letify-ext
        run: |
          npm ci
          npm run build
          npm test
