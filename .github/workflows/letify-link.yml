# Check the letify-link crate on every platform it must run on. This workflow is not part of
# a release: the release gates are in publish-crates.yml and publish.yml, and neither reads
# this file. `test` builds and tests the crate on Linux, macOS and Windows. The two mobile
# jobs only check that the crate compiles for iOS and Android, each in its own job, so a
# missing mobile tool fails its own job and nothing else.
name: letify-link

on:
  push:
    paths:
      - "letify-core/**"
      - ".github/workflows/letify-link.yml"
  pull_request:
    paths:
      - "letify-core/**"
      - ".github/workflows/letify-link.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: letify-core

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p letify-link --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build -p letify-link --all-features --locked
      - name: Test with the relay role
        run: cargo test -p letify-link --features relay --locked

  mobile-ios:
    name: check (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and the iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
      - name: Check the library
        # Xcode on the runner supplies the C compiler that ring's build script needs.
        run: cargo check -p letify-link --lib --features relay --target aarch64-apple-ios --locked

  mobile-android:
    name: check (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and the Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Check the library
        # cargo check needs no linker, only the C compiler of the NDK for ring's build script.
        # The runner image ships the NDK and names it in ANDROID_NDK_LATEST_HOME.
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo check -p letify-link --lib --features relay --target aarch64-linux-android --locked
