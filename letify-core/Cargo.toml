# letify-core: the Rust components of letify.
#
# letify's Python package stays pure Python. What cannot be done from Python lives here and
# is built separately: the letify crate for crates.io and the letify-quic binary that the
# wheels carry. A user who only ships functions to remote machines over SSH never needs it.
[workspace]
resolver = "3"
members = ["letify", "letify-quic"]

[workspace.package]
version = "2.10.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/DarkPyonix/letify"
