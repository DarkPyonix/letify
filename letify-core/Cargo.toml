# letify-core: the Rust components of letify.
#
# letify's Python package stays pure Python. What cannot be done from Python lives here and
# is built separately: the letify crate for crates.io and the letify-link binary that the
# wheels carry. A user who only ships functions to remote machines over SSH never needs it.
[workspace]
resolver = "3"
members = ["letify", "letify-link"]

[workspace.package]
version = "3.0.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/DarkPyonix/letify"

# The letify-link tests move hundreds of MiB through ChaCha20-Poly1305. Optimised dependencies
# keep them measuring the session and not the debug build of the cipher.
[profile.dev.package."*"]
opt-level = 3
