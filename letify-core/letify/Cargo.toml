[package]
name = "letify"
description = "The Rust face of letify, a declarative tool for running Python and PyTorch work on remote GPUs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/DarkPyonix/letify"
documentation = "https://docs.rs/letify"
keywords = ["infrastructure", "gpu", "remote", "nat-traversal", "declarative"]
categories = ["development-tools", "network-programming"]

[dependencies]
# The pin keeps a published letify on the letify-link of its own release. scripts/version.py
# rewrites it with the version.
letify-link = { version = "=3.0.3", path = "../letify-link" }

[features]
# Enable the relay role of letify-link.
relay = ["letify-link/relay"]
