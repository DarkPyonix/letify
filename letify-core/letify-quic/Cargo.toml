[package]
name = "letify-quic"
description = "Carries a letify session over QUIC, for a network that throttles unclassified UDP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "letify-quic"
path = "src/main.rs"

[dependencies]
# quinn is the QUIC implementation; rustls with the ring backend keeps the build to pure
# Rust, with no system OpenSSL to find on six platforms.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "io-std", "macros", "time"] }
