[package]
name = "letify-link"
description = "The letify connection layer: an encrypted, multiplexed session that survives the loss of its transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# snow is the Noise implementation, with its pure Rust default crypto resolver.
snow = "0.9"
ed25519-dalek = "2"
# getrandom seeds a generated node key from the operating system.
getrandom = "0.2"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
# socket2 sets the TCP keepalive options that tokio does not expose.
socket2 = { version = "0.5", features = ["all"] }
# quinn carries a UDP path: loss recovery and BBR over a punched UDP socket. rustls with the
# ring backend keeps the build pure Rust, and rcgen makes the throwaway certificate QUIC needs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
serde_json = "1.0.154"

[features]
# The relay role: a node that forwards session ciphertext between two authenticated nodes, and
# the dialer that reaches a peer through one. The sidecar is built with it.
relay = ["tokio/rt-multi-thread"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
