[package]
name = "letify-link"
description = "The letify connection layer: an encrypted, multiplexed session that survives the loss of its transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/DarkPyonix/letify"
documentation = "https://docs.rs/letify-link"
keywords = ["nat-traversal", "multipath", "noise", "quic", "networking"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# snow is the Noise implementation, with its pure Rust default crypto resolver.
snow = { version = "0.9", features = ["ring-accelerated"] }
ed25519-dalek = "2"
# getrandom seeds a generated node key from the operating system.
getrandom = "0.2"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
# socket2 sets the TCP keepalive options that tokio does not expose.
socket2 = { version = "0.5", features = ["all"] }
# quinn carries a UDP path: loss recovery and BBR over a punched UDP socket. rustls with the
# ring backend keeps the build pure Rust, and rcgen makes the throwaway certificate QUIC needs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
serde_json = "1.0.154"
# The signal feature. rustls is the dependency above, with the ring backend. webpki-roots
# carries the Mozilla trust roots as data, so the client verifies the service the same way on
# Linux, macOS, Windows, iOS and Android without a platform verifier.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
# geteuid, to check who owns a key file.
libc = "0.2"

[features]
# The relay role: a node that forwards session ciphertext between two authenticated nodes, and
# the dialer that reaches a peer through one. The sidecar is built with it.
relay = ["tokio/rt-multi-thread"]
# SignalRendezvous: the Rendezvous trait over the signalling service, for an embedder that
# wants the owner's Worker without writing a client. It adds tokio-rustls, webpki-roots, sha2
# and base64 to the build, and nothing when the feature is off.
signal = ["dep:tokio-rustls", "dep:webpki-roots", "dep:sha2", "dep:base64"]

[dev-dependencies]
# The signal test verifies requests the way the Worker does.
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["full", "test-util"] }
