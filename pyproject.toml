[project]
name = "letify"
version = "2.1.3"
description = "Declarations that become infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DarkPyonix" }]
keywords = ["gpu", "remote-execution", "colab", "infrastructure", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cloudpickle>=3.0",
    "blake3>=0.4",
]

[project.urls]
Homepage = "https://github.com/DarkPyonix/letify"
Documentation = "https://github.com/DarkPyonix/letify/tree/main/docs"
Repository = "https://github.com/DarkPyonix/letify"
Issues = "https://github.com/DarkPyonix/letify/issues"

[project.scripts]
letify = "letify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # The suite exercises real workers, real sockets and a real uv sync, so most of its
    # seven minutes is spent waiting rather than computing. xdist runs it across cores.
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "researchtree>=1.3",
]
# The guide site: uv run --only-group docs mkdocs serve -f docs/mkdocs.yml
# MkDocs is held below 2.0, which removes the plugin and theme systems Material depends on.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["letify"]
# letify-core binaries are gitignored build products. CI copies them into letify/remoting/lib/
# with letify-core/build.py before building each platform wheel, and artifacts includes them.
artifacts = ["letify/remoting/lib/*"]

[tool.hatch.build.targets.sdist]
exclude = ["letify/remoting/lib", "letify-core/target"]

# The fallback type for Launcher.providers. It is a top level module because a project's generated
# stub replaces it by that name.
[tool.hatch.build.targets.wheel.force-include]
"letify_providers.py" = "letify_providers.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# SIM105 asks for contextlib.suppress. Teardown paths here run while a session
# is being torn down, and an explicit try block reads more plainly there.
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The suite exercises real workers, real sockets and a real uv sync, so most of its time is
# spent waiting rather than computing. Across cores it runs in about half a minute instead
# of seven minutes. Every test takes its own tmp_path and its own free port, so nothing is
# shared between workers.
addopts = "-n 8"
