[project]
name = "letify"
version = "1.0.0"
description = "Declarations that become infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DarkPyonix" }]
keywords = ["gpu", "remote-execution", "colab", "infrastructure", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cloudpickle>=3.0",
    "blake3>=0.4",
]

[project.optional-dependencies]
colab = ["google-colab-cli>=0.1"]
modal = ["modal>=0.64"]
shell = ["paramiko>=3.4", "httpx>=0.27"]
gcs = ["google-cloud-storage>=2.14"]
s3 = ["boto3>=1.34"]
keyring = ["keyring>=24.0"]
all = [
    "google-colab-cli>=0.1",
    "modal>=0.64",
    "paramiko>=3.4",
    "httpx>=0.27",
    "google-cloud-storage>=2.14",
    "boto3>=1.34",
    "keyring>=24.0",
]

[project.urls]
Homepage = "https://github.com/DarkPyonix/letify"
Documentation = "https://github.com/DarkPyonix/letify/tree/main/docs"
Repository = "https://github.com/DarkPyonix/letify"
Issues = "https://github.com/DarkPyonix/letify/issues"

[project.scripts]
letify = "letify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "researchtree>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["letify"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# SIM105 asks for contextlib.suppress. Teardown paths here run while a session
# is being torn down, and an explicit try block reads more plainly there.
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
